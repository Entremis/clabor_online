<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настройка игры Клабор</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h2>Настройка игры</h2>

<div id="resumeBlock" class="resume-block" style="display:none;">
    <strong>Незаконченная игра:</strong> <span id="resumePlayers"></span>
    <button type="button" onclick="window.location.href='game_page.html'">Продолжить</button>
</div>

<form id="gameSetup">
    <p>Размер игры:</p>
    <input type="radio" id="score501" name="gameSize" value="501" checked>
    <label for="score501">501</label>
    <input type="radio" id="score1001" name="gameSize" value="1001">
    <label for="score1001">1001</label>

    <p>Режим игры:</p>
    <input type="radio" id="modeIndividual" name="gameMode" value="individual" checked>
    <label for="modeIndividual">Каждый сам за себя (2–3 игрока)</label>
    <br>
    <input type="radio" id="modePairs" name="gameMode" value="pairs">
    <label for="modePairs">Пара на пару (2×2)</label>

    <h3 id="playersHeading">Введите имена игроков:</h3>
    <p class="hint" id="playersHint"></p>
    <div id="playerNames"><!-- заполняется из setup.js по режиму --></div>
    <button type="button" id="addPlayerBtn" onclick="addPlayer()">+</button>
    <button type="submit">Начать игру</button>
</form>

<script src="setup.js"></script>
</body>
</html>
